name: verified perspective source delivery
on:
  push:
    branches: ['feat/perspective-state-and-agent-execution']
    paths: ['.delivery/perspective-source-6.txt']
permissions:
  contents: write
jobs:
  apply-tested-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify original and final hashes before applying source edits
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          payload=''.join(pathlib.Path(f'.delivery/perspective-source-{i}.txt').read_text().strip() for i in range(1,7))
          raw=lzma.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='737bb944f3ffde9451c10a847a41bf60dcf6b59f64e584cb4fad8a4683d250e5', 'Source edit manifest hash mismatch'
          manifest=json.loads(raw)
          prepared=[]
          for row in manifest['files']:
              p=pathlib.Path(row['path'])
              assert not p.is_absolute() and '..' not in p.parts and not p.is_symlink()
              assert p.as_posix()=='README.md' or p.parts[0] in {'skills','tests','docs'}
              old=p.read_text(encoding='utf-8') if p.is_file() else None
              digest=hashlib.sha256(old.encode('utf-8')).hexdigest() if old is not None else None
              assert digest==row['old_sha256'], 'Original source changed; refusing overwrite'
              if row.get('delete'):
                  prepared.append((p,None)); continue
              if 'content' in row:
                  new=row['content']
              else:
                  new=old
                  for start,end,replacement in reversed(row['edits']):
                      assert 0<=start<=end<=len(new)
                      new=new[:start]+replacement+new[end:]
              assert hashlib.sha256(new.encode('utf-8')).hexdigest()==row['new_sha256'], 'Final source hash mismatch'
              prepared.append((p,new))
          for p,new in prepared:
              if new is None: p.unlink()
              else:
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(new,encoding='utf-8')
          print('Verified and applied readable source files:',len(prepared))
          PY
          git rm .delivery/perspective-source-*.txt
          python3 -m compileall -q skills tests
          node --check skills/pastiche-profile/scripts/story_workbench/web/app.js
          python3 -m unittest discover -s tests > "$RUNNER_TEMP/perspective-tests.log" 2>&1 || { tail -80 "$RUNNER_TEMP/perspective-tests.log"; exit 1; }
          tail -10 "$RUNNER_TEMP/perspective-tests.log"
          git add README.md docs skills tests
          git diff --cached --check
      - name: Commit tested source without modifying workflow permissions
        run: |
          branch='feat/perspective-state-and-agent-execution'
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement explicit perspectives, provider-neutral task handoff and current-pipeline refactor'
          git push origin "HEAD:refs/heads/$branch"
