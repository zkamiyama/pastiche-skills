name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tracked source only
        run: git archive --format=zip --output=source-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.zip
          retention-days: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test with synthetic corpus (no real books)
        run: python -m unittest discover -s tests -v
      - name: Validate fugashi-plus and UniDic-lite wheels
        run: |
          python -m pip install 'fugashi-plus[unidic-lite]==1.5.2.post1'
          python -c 'from importlib import metadata; from fugashi import Tagger; assert metadata.version("fugashi-plus"); assert [w.surface for w in Tagger()("来たっ！ 来たッ！")]'
