name: verified style refinement source delivery
on:
  push:
    branches: ['feat/audited-style-refine']
    paths: ['.delivery/refine-5.patch']
permissions:
  contents: write
jobs:
  apply-tested-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact readable source patch before application
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          parts=[]
          for i in range(1,6):
              data=pathlib.Path(f'.delivery/refine-{i}.patch').read_bytes()
              print('part',i,'bytes',len(data),'sha256',hashlib.sha256(data).hexdigest())
              parts.append(data)
          patch=b''.join(parts)
          assert hashlib.sha256(patch).hexdigest()=='67d914ba7d2ea0f78c721d1e1eed72ab789b0390cb3646785f663f18bc9838dc', 'Source checksum mismatch; nothing applied'
          pathlib.Path('/tmp/refine.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/refine.patch
          git apply --index /tmp/refine.patch
          git rm .delivery/refine-*.patch
          python3 -m compileall -q skills tests verification
          python3 -m unittest discover -s tests > "$RUNNER_TEMP/refine-tests.log" 2>&1 || { tail -80 "$RUNNER_TEMP/refine-tests.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/refine-tests.log"
          python3 verification/mutation_check.py
          git diff --cached --check
          cp .git/index "$RUNNER_TEMP/verified.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/verified.index" git update-index --force-remove .github/workflows/refine-source-delivery.yml
          tree=$(GIT_INDEX_FILE="$RUNNER_TEMP/verified.index" git write-tree)
          test "$tree" = '54dd01425d14459fbdf0e0680822ba00b77b3204'
      - name: Publish tested readable application sources on the feature branch
        run: |
          branch='feat/audited-style-refine'
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add evidence-bound Write refinement, semantic revalidation and counterbalanced selection'
          git push origin "HEAD:refs/heads/$branch"
