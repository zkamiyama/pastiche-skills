name: verified correctness audit source delivery
on:
  push:
    branches: ['fix/rigorous-perspective-audit']
    paths: ['.delivery/audit-8.patch']
permissions:
  contents: write
jobs:
  apply-tested-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify the readable patch before applying any changes
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          parts=[]
          for i in range(1,9):
              data=pathlib.Path(f'.delivery/audit-{i}.patch').read_bytes()
              # Only transport whitespace before a diff header is normalized.
              # The resulting complete patch must still match the local audit hash.
              data=data.replace(b'\n diff --git ',b'\ndiff --git ')
              print('part',i,'bytes',len(data),'sha256',hashlib.sha256(data).hexdigest())
              parts.append(data)
          patch=b''.join(parts)
          assert hashlib.sha256(patch).hexdigest()=='7b8d2434ddc840f25722f7476fa81a953967cca76b00adef18200f7f5f2bc0d1', 'Source patch checksum mismatch; nothing applied'
          pathlib.Path('/tmp/audit.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/audit.patch
          git apply --index /tmp/audit.patch
          git rm .delivery/audit-*.patch
          python3 -m compileall -q skills tests verification
          node --check skills/pastiche-profile/scripts/story_workbench/web/app.js
          python3 -m unittest discover -s tests > "$RUNNER_TEMP/audit-tests.log" 2>&1 || { tail -80 "$RUNNER_TEMP/audit-tests.log"; exit 1; }
          tail -12 "$RUNNER_TEMP/audit-tests.log"
          python3 verification/mutation_check.py
          git diff --cached --check
      - name: Publish tested source to the audit branch without rewriting history
        run: |
          branch='fix/rigorous-perspective-audit'
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden perspective chronology, source provenance and task boundaries with exhaustive finite verification'
          git push origin "HEAD:refs/heads/$branch"
