name: verified cluster recovery source delivery
on:
  push:
    branches: ['fix/style-cluster-recovery']
    paths: ['.delivery/cluster-repair-3.patch']
permissions:
  contents: write
jobs:
  apply-tested-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and test readable patch
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          patch=b''.join(pathlib.Path(f'.delivery/cluster-repair-{i}.patch').read_bytes() for i in range(1,4))
          assert hashlib.sha256(patch).hexdigest()=='226b253a818d99117aba1a0aaa75d2336bd92695e8b21db943c795eef70be360', 'Source checksum mismatch; no edits applied'
          pathlib.Path('/tmp/cluster-repair.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/cluster-repair.patch
          git apply --index /tmp/cluster-repair.patch
          git rm .delivery/cluster-repair-*.patch
          python3 -m compileall -q skills tests verification
          python3 -m unittest discover -s tests > "$RUNNER_TEMP/cluster-tests.log" 2>&1 || { tail -80 "$RUNNER_TEMP/cluster-tests.log"; exit 1; }
          tail -10 "$RUNNER_TEMP/cluster-tests.log"
          python3 verification/mutation_check.py
          git diff --cached --check
          cp .git/index "$RUNNER_TEMP/verified.index"
          GIT_INDEX_FILE="$RUNNER_TEMP/verified.index" git update-index --force-remove .github/workflows/cluster-repair-delivery.yml
          tree=$(GIT_INDEX_FILE="$RUNNER_TEMP/verified.index" git write-tree)
          test "$tree" = '40f42dbd4acbbf8c8df53ba17d3e63a6691c04f7'
      - name: Publish tested sources on the repair branch
        run: |
          branch='fix/style-cluster-recovery'
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Recover invalid style-cluster replies with strict repair retries and preserved checkpoints'
          git push origin "HEAD:refs/heads/$branch"
