name: verified world graph source delivery
on:
  push:
    branches: ['feat/world-knowledge-graph']
    paths: ['.delivery/world-part-6.b64', '.github/workflows/world-source-delivery.yml']
permissions:
  contents: write
jobs:
  apply-tested-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and apply the source-only patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          payload=''.join(pathlib.Path(f'.delivery/world-part-{i}.b64').read_text().strip() for i in range(1,7))
          patch=lzma.decompress(base64.b64decode(payload,validate=True))
          expected='274fd8015602f53b86e46a630e9ba99bfcf061604a19193d39faac4ba788f470'
          assert hashlib.sha256(patch).hexdigest()==expected, 'Source patch hash mismatch; nothing applied'
          pathlib.Path('/tmp/world.patch').write_bytes(patch)
          PY
          git apply --check --index --exclude=.github/workflows/test.yml /tmp/world.patch
          git apply --index --exclude=.github/workflows/test.yml /tmp/world.patch
          git rm .delivery/world-part-*.b64
          python3 -m compileall -q skills
          node --check skills/pastiche-profile/scripts/story_workbench/web/app.js
          python3 -m unittest discover -s tests
          git diff --cached --check
      - name: Commit verified readable application source to the feature branch
        run: |
          branch='feat/world-knowledge-graph'
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate typed world knowledge, rule conditions, evidence review and writing constraints'
          git push origin "HEAD:refs/heads/$branch"
